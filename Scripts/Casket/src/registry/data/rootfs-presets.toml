# &desc: "Rootfs distro preset registry for 'rootfs add --preset <distro> [<version>]' -- data, not code. Every URL here is verified against the real endpoint, not assumed. latest_index_url (Alpine) is a machine-readable index that carries its own checksum, resolved+verified in one fetch; distros without a verified 'latest' mechanism omit both latest_index_url and latest_url, and 'add --preset <distro>' (no version) refuses rather than guess. arch_names overrides {arch} substitution per distro when their naming differs from Rust's std::env::consts::ARCH (e.g. Ubuntu/Debian call x86_64 'amd64')."

[alpine]
# Alpine's own machine-readable release index -- includes file name,
# version, and sha256 in one document, so no separate checksum fetch is
# needed for the latest path. https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/{arch}/latest-releases.yaml
latest_index_url = "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/{arch}/latest-releases.yaml"
latest_index_flavor = "alpine-minirootfs"
pinned_url        = "https://dl-cdn.alpinelinux.org/alpine/v{minor}/releases/{arch}/alpine-minirootfs-{version}-{arch}.tar.gz"
checksum_suffix   = ".sha256"

[ubuntu]
pinned_url        = "https://cloud-images.ubuntu.com/releases/{version}/release/ubuntu-{version}-server-cloudimg-{arch}-root.tar.xz"
checksum_suffix   = "/SHA256SUMS"
arch_names.x86_64  = "amd64"
arch_names.aarch64 = "arm64"

[debian]
pinned_url        = "https://github.com/debuerreotype/docker-debian-artifacts/raw/{version}/{arch}/rootfs.tar.xz"
checksum_suffix   = ".sha256"
arch_names.x86_64  = "amd64"
arch_names.aarch64 = "arm64"

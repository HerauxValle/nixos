# &desc: "Rootfs distro preset registry for 'rootfs add --preset <distro> [<version>]' -- data, not code. No maintained 'latest version' or checksum table: latest_url is each distro's own stable 'always current' alias, followed live; checksum_suffix is appended to whichever tarball URL was actually resolved and fetched fresh from the distro's own site, never cached here. {arch} is substituted with the host architecture (x86_64/aarch64); {version}/{minor} only apply to pinned_url."

[alpine]
latest_url      = "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/{arch}/alpine-minirootfs-latest-{arch}.tar.gz"
pinned_url      = "https://dl-cdn.alpinelinux.org/alpine/v{minor}/releases/{arch}/alpine-minirootfs-{version}-{arch}.tar.gz"
checksum_suffix = ".sha256"

[ubuntu]
latest_url      = "https://cloud-images.ubuntu.com/releases/current/release/ubuntu-current-server-cloudimg-{arch}-root.tar.xz"
pinned_url      = "https://cloud-images.ubuntu.com/releases/{version}/release/ubuntu-{version}-server-cloudimg-{arch}-root.tar.xz"
checksum_suffix = "/SHA256SUMS"

[debian]
latest_url      = "https://github.com/debuerreotype/docker-debian-artifacts/raw/dist-stable/{arch}/rootfs.tar.xz"
pinned_url      = "https://github.com/debuerreotype/docker-debian-artifacts/raw/{version}/{arch}/rootfs.tar.xz"
checksum_suffix = ".sha256"
